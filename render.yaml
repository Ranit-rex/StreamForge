services:
  - type: web
    name: streamforge-chat-api
    runtime: node
    plan: standard
    region: singapore
    repo: https://github.com/Ranit-rex/StreamForge
    branch: capacity-500-production
    buildCommand: cd chat-backend && npm ci
    startCommand: cd chat-backend && npm start
    healthCheckPath: /api/voice/health
    numInstances: 1
    maxShutdownDelaySeconds: 300
    envVars:
      - key: VOICE_NODE_ID
        value: "1"
      - key: MAX_ACTIVE_ROOMS
        value: "72"

