name: CastDoo Admin APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - "admin/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/castdoo-admin.yml"
permissions:
  contents: read
concurrency:
  group: castdoo-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore Admin signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: castdoo-admin-debug-signing-v1
      - name: Ensure signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Calculate build number
        shell: bash
        run: |
          BUILD_NUMBER=$((1073 + GITHUB_RUN_NUMBER))
          if [ "$BUILD_NUMBER" -lt 1073 ]; then BUILD_NUMBER=1073; fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - name: Build Admin APK
        env:
          CASTDOO_PRIVATE_ADMIN_PAIRING_CODE: ${{ secrets.CASTDOO_ADMIN_PAIRING_CODE }}
        run: |
          test -n "$CASTDOO_PRIVATE_ADMIN_PAIRING_CODE" || { echo "::error::Add CASTDOO_ADMIN_PAIRING_CODE in GitHub Actions secrets."; exit 1; }
          gradle --no-daemon --stacktrace :admin:assembleDebug -PstreamforgeBuildNumber="$BUILD_NUMBER" -PcastdooPrivateAdminPairingCode="$CASTDOO_PRIVATE_ADMIN_PAIRING_CODE"
      - name: Name and verify APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="admin/build/outputs/apk/debug"
          APK="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mv "$APK" "$OUT/CastDoo-Admin-build-${BUILD_NUMBER}.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$OUT/CastDoo-Admin-build-${BUILD_NUMBER}.apk" | grep -F "package: name='com.castdoo.admin'"
      - name: Save signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: castdoo-admin-debug-signing-v1
      - name: Upload Admin APK
        uses: actions/upload-artifact@v7
        with:
          name: CastDoo-Admin-APK
          path: admin/build/outputs/apk/debug/CastDoo-Admin-build-${{ env.BUILD_NUMBER }}.apk
          if-no-files-found: error
          archive: false
          retention-days: 14
