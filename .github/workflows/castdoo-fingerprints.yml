name: CastDoo Debug Certificate Fingerprints

on:
  push:
    branches:
      - feature/castdoo-auth-foundation
    paths:
      - .github/workflows/castdoo-fingerprints.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/castdoo-auth-foundation
          persist-credentials: true

      - name: Restore the same stable debug signing key used by APK builds
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: streamforge-debug-signing-v1

      - name: Ensure signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Extract certificate fingerprints
        shell: bash
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey > cert.txt
          SHA1="$(awk -F': ' '/SHA1:/{print $2; exit}' cert.txt)"
          SHA256="$(awk -F': ' '/SHA256:/{print $2; exit}' cert.txt)"
          test -n "$SHA1" && test -n "$SHA256"
          {
            echo "# CastDoo Android debug certificate"
            echo
            echo "Package: com.castdoo.app"
            echo "Certificate type: stable GitHub Actions debug key"
            echo
            echo "SHA-1: $SHA1"
            echo
            echo "SHA-256: $SHA256"
            echo
            echo "This is the same keystore used by the Android APK build workflow."
          } > CASTDOO_DEBUG_FINGERPRINTS.txt
          cat CASTDOO_DEBUG_FINGERPRINTS.txt

      - name: Save signing key cache if it was not present
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: streamforge-debug-signing-v1

      - name: Commit fingerprint report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CASTDOO_DEBUG_FINGERPRINTS.txt
          if git diff --cached --quiet; then
            echo "Fingerprint report is already up to date."
            exit 0
          fi
          git commit -m "Align CastDoo fingerprints with APK signing key"
          git push origin HEAD:feature/castdoo-auth-foundation
