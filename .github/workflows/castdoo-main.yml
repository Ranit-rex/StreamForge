name: CastDoo Main APK
on:
  workflow_dispatch:
  push:
    branches: [feature/castdoo-auth-foundation, feature/castdoo-mongodb-push-admin-pairing]
    paths:
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/castdoo-main.yml"
permissions:
  contents: write
concurrency:
  group: castdoo-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore Main signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: streamforge-debug-signing-v1
      - name: Verify Firebase-registered signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore" || { echo "Stable signing key cache is missing; refusing to generate a different certificate."; exit 1; }
          SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/{print $2; exit}')"
          echo "Stable APK SHA-1: $SHA1"
          ACTUAL="$(printf '%s' "$SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="660C3627E118939405591DF55A92CC9C3FA0B322"
          test "$ACTUAL" = "$EXPECTED" || { echo "Signing SHA-1 does not match Firebase registration."; exit 1; }
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Calculate build number
        shell: bash
        run: |
          BUILD_NUMBER=$((1073 + GITHUB_RUN_NUMBER - 114))
          if [ "$BUILD_NUMBER" -lt 1073 ]; then BUILD_NUMBER=1073; fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - name: Build Main APK
        run: gradle --no-daemon --stacktrace :android:assembleDebug -PstreamforgeBuildNumber="$BUILD_NUMBER"
      - name: Name and verify APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/build/outputs/apk/debug"
          APK="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mv "$APK" "$OUT/CastDoo-Stable-build-${BUILD_NUMBER}.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$OUT/CastDoo-Stable-build-${BUILD_NUMBER}.apk" | grep -F "package: name='com.castdoo.app'"
      - name: Save signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: streamforge-debug-signing-v1
      - name: Upload Main APK
        uses: actions/upload-artifact@v7
        with:
          name: CastDoo-Stable-APK
          path: android/build/outputs/apk/debug/CastDoo-Stable-build-${{ env.BUILD_NUMBER }}.apk
          if-no-files-found: error
          archive: false
          retention-days: 14

# Rebuild trigger: latest shared Kotlin compile fix is included.

      - name: Publish direct Stable APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: castdoo-stable-build-${{ env.BUILD_NUMBER }}
          name: CastDoo Stable build ${{ env.BUILD_NUMBER }}
          prerelease: true
          files: android/build/outputs/apk/debug/CastDoo-Stable-build-${{ env.BUILD_NUMBER }}.apk
