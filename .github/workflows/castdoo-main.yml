name: CastDoo Main APK
on:
  workflow_dispatch:
  push:
    branches: [feature/castdoo-auth-foundation, feature/castdoo-mongodb-push-admin-pairing]
    paths:
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/castdoo-main.yml"
permissions:
  contents: write
concurrency:
  group: castdoo-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore CastDoo signing credentials
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/castdoo-upload.jks"
          test -s "$HOME/.android/castdoo-upload.jks"
          echo "SIGNING_KEYSTORE_PATH=$HOME/.android/castdoo-upload.jks" >> "$GITHUB_ENV"
          SHA1="$(keytool -list -v -keystore "$HOME/.android/castdoo-upload.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}')"
          ACTUAL="$(printf '%s' "$SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="660C3627E118939405591DF55A92CC9C3FA0B322"
          echo "CastDoo signing certificate SHA-1: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::This keystore does not match CastDoo's existing Firebase-registered signing certificate."; exit 1; }
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Calculate build number
        shell: bash
        run: |
          BUILD_NUMBER=$((1073 + GITHUB_RUN_NUMBER - 114))
          if [ "$BUILD_NUMBER" -lt 1073 ]; then BUILD_NUMBER=1073; fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - name: Build CastDoo APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ env.SIGNING_KEYSTORE_PATH }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :android:assembleDebug -PstreamforgeBuildNumber="$BUILD_NUMBER"
      - name: Name and verify APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/build/outputs/apk/debug"
          APK="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mv "$APK" "$OUT/CastDoo-Stable-build-${BUILD_NUMBER}.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          FINAL_APK="$OUT/CastDoo-Stable-build-${BUILD_NUMBER}.apk"
          "$AAPT" dump badging "$FINAL_APK" | grep -F "package: name='com.castdoo.app'"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"
          CERT_SHA1="$("$APKSIGNER" verify --print-certs "$FINAL_APK" | awk -F': ' '/Signer #1 certificate SHA-1 digest:/{print toupper($2); exit}')"
          EXPECTED_SHA1="660C3627E118939405591DF55A92CC9C3FA0B322"
          test "$CERT_SHA1" = "$EXPECTED_SHA1" || { echo "::error::APK signing certificate changed; refusing to publish an incompatible update."; exit 1; }
          echo "Verified package: com.castdoo.app"
          echo "Verified stable signing certificate: $CERT_SHA1"
      - name: Upload CastDoo APK
        uses: actions/upload-artifact@v7
        with:
          name: CastDoo-Stable-APK
          path: android/build/outputs/apk/debug/CastDoo-Stable-build-${{ env.BUILD_NUMBER }}.apk
          if-no-files-found: error
          archive: false
          retention-days: 14
      - name: Publish direct Stable APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: castdoo-stable-build-${{ env.BUILD_NUMBER }}
          name: CastDoo Stable build ${{ env.BUILD_NUMBER }}
          prerelease: true
          files: android/build/outputs/apk/debug/CastDoo-Stable-build-${{ env.BUILD_NUMBER }}.apk
