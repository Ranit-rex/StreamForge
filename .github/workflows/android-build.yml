name: CastDoo Beta and Stable builds
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - "android/**"
      - "admin/**"
      - "admin-api/**"
      - "beta/**"
      - "functions/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
permissions:
  contents: read
concurrency:
  group: castdoo-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: streamforge-debug-signing-v1
      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E "Alias name:|SHA1:|SHA256:"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Calculate build number
        shell: bash
        run: |
          BUILD_NUMBER=$((1073 + GITHUB_RUN_NUMBER - 114))
          if [ "$BUILD_NUMBER" -lt 1073 ]; then BUILD_NUMBER=1073; fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - name: Build Beta and Admin APKs
        if: github.ref == 'refs/heads/feature/castdoo-admin-beta-platform'
        run: gradle --no-daemon --stacktrace :beta:assembleDebug :admin:assembleDebug -PstreamforgeBuildNumber="$BUILD_NUMBER"
      - name: Build Stable APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/castdoo-auth-foundation'
        run: gradle --no-daemon --stacktrace :android:assembleDebug -PstreamforgeBuildNumber="$BUILD_NUMBER"
      - name: Name and verify Beta and Admin APKs
        if: github.ref == 'refs/heads/feature/castdoo-admin-beta-platform'
        shell: bash
        run: |
          set -euo pipefail
          BETA="beta/build/outputs/apk/debug"
          ADMIN="admin/build/outputs/apk/debug"
          BETA_APK="$(find "$BETA" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          ADMIN_APK="$(find "$ADMIN" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$BETA_APK" && test -n "$ADMIN_APK"
          mv "$BETA_APK" "$BETA/CastDoo-Beta-build-${BUILD_NUMBER}.apk"
          mv "$ADMIN_APK" "$ADMIN/CastDoo-Admin-build-${BUILD_NUMBER}.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$BETA/CastDoo-Beta-build-${BUILD_NUMBER}.apk" 2>&1)"
          echo "$SIGNER_OUTPUT"
          echo "$SIGNER_OUTPUT" | grep -qi "certificate SHA-1 digest: 660c3627e118939405591df55a92cc9c3fa0b322"
          "$AAPT" dump badging "$BETA/CastDoo-Beta-build-${BUILD_NUMBER}.apk" | grep -F "package: name='com.castdoo.beta'"
          "$AAPT" dump badging "$ADMIN/CastDoo-Admin-build-${BUILD_NUMBER}.apk" | grep -F "package: name='com.castdoo.admin'"
      - name: Name and verify Stable APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/castdoo-auth-foundation'
        shell: bash
        run: |
          set -euo pipefail
          STABLE="android/build/outputs/apk/debug"
          APK="$(find "$STABLE" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mv "$APK" "$STABLE/CastDoo-Stable-build-${BUILD_NUMBER}.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$STABLE/CastDoo-Stable-build-${BUILD_NUMBER}.apk" 2>&1)"
          echo "$SIGNER_OUTPUT"
          echo "$SIGNER_OUTPUT" | grep -qi "certificate SHA-1 digest: 660c3627e118939405591df55a92cc9c3fa0b322"
          "$AAPT" dump badging "$STABLE/CastDoo-Stable-build-${BUILD_NUMBER}.apk" | grep -F "package: name='com.castdoo.app'"
      - name: Save stable debug signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: streamforge-debug-signing-v1
      - name: Build Cloud Functions
        shell: bash
        run: |
          cd functions
          npm install --no-audit --no-fund
          npm run build
      - name: Upload Beta APK
        if: github.ref == 'refs/heads/feature/castdoo-admin-beta-platform'
        uses: actions/upload-artifact@v7
        with:
          path: beta/build/outputs/apk/debug/CastDoo-Beta-build-${{ env.BUILD_NUMBER }}.apk
          archive: false
          retention-days: 14
      - name: Upload Admin APK
        if: github.ref == 'refs/heads/feature/castdoo-admin-beta-platform'
        uses: actions/upload-artifact@v7
        with:
          path: admin/build/outputs/apk/debug/CastDoo-Admin-build-${{ env.BUILD_NUMBER }}.apk
          archive: false
          retention-days: 14
      - name: Upload Stable APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/castdoo-auth-foundation'
        uses: actions/upload-artifact@v7
        with:
          path: android/build/outputs/apk/debug/CastDoo-Stable-build-${{ env.BUILD_NUMBER }}.apk
          archive: false
          retention-days: 14
