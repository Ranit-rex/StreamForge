name: Android APK build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
permissions:
  contents: read
concurrency:
  group: streamforge-android-signing
  cancel-in-progress: false

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Keep one debug signing identity across ephemeral GitHub runners. Without this,
      # every APK gets a different certificate and Android refuses in-place upgrades.
      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: streamforge-debug-signing-v1
      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E "Alias name:|SHA1:|SHA256:"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Calculate Alpha build number
        shell: bash
        run: |
          BUILD_NUMBER=$((1073 + GITHUB_RUN_NUMBER - 114))
          if [ "$BUILD_NUMBER" -lt 1073 ]; then BUILD_NUMBER=1073; fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
      - name: Build Alpha APK
        run: gradle --no-daemon --stacktrace :android:assembleDebug -PstreamforgeBuildNumber="$BUILD_NUMBER"
      - name: Name APK
        shell: bash
        run: |
          APK="$(find android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mv "$APK" "android/build/outputs/apk/debug/StreamForge-Alpha-build-${BUILD_NUMBER}.apk"
      - name: Verify APK package and signing certificate
        shell: bash
        run: |
          APK="$(find android/build/outputs/apk/debug -maxdepth 1 -type f -name 'StreamForge-Alpha-build-*.apk' | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK" && test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Expected applicationId: app.streamforge.mobile"
      - name: Save stable debug signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: streamforge-debug-signing-v1
      # GitHub Actions v7 supports a raw, non-ZIP artifact for a single APK file.
      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: android/build/outputs/apk/debug/StreamForge-Alpha-build-${{ env.BUILD_NUMBER }}.apk
          archive: false
          retention-days: 14
