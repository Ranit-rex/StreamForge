name: Remove public APK releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-public-releases.yml"

permissions:
  contents: write

jobs:
  delete-public-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every published release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > /tmp/release-tags.txt
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting public release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done < /tmp/release-tags.txt
          echo "Remaining releases:"
          gh release list --limit 1000
