name: Deploy StreamForge Cloudflare Voice

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-voice/**"
      - ".github/workflows/deploy-cloudflare-voice.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy Worker and Durable Objects
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "cloudflare-voice"
          command: deploy
