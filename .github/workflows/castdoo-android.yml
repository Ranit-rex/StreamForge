name: CastDoo Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
    paths:
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/castdoo-android.yml"
permissions:
  contents: read
concurrency:
  group: castdoo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build CastDoo Android APK
        run: gradle --no-daemon --stacktrace :android:assembleDebug -PstreamforgeBuildNumber=1074
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.castdoo.app'"
      - name: Upload CastDoo APK
        uses: actions/upload-artifact@v7
        with:
          name: CastDoo-Android-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          archive: true
          retention-days: 14
